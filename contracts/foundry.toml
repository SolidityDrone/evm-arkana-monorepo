[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
optimizer = true
optimizer_runs = 200
via_ir = true

# Link PoseidonT3 as external library so PoseidonHasher stays under 24KB contract size limit.
# Uses deterministic address from poseidon-solidity (deploy via their proxy if not present on chain).
libraries = ["poseidon-solidity/PoseidonT3.sol:PoseidonT3:0x3333333C0A88F9BE4fd23ed0536F9B6c427e3B93"]  

# Suppress style/note lints (e.g. SCREAMING_SNAKE_CASE const, mixedCase vars)
[lint]
exclude_lints = [
    "screaming-snake-case-const",
    "screaming-snake-case-immutable",
    "mixed-case-variable",
    "mixed-case-function",
    "unaliased-plain-import",
    "named-struct-fields",
    "asm-keccak256",
    "unsafe-cheatcode",
    "pascal-case-struct",
    "unused-import",
    "unwrapped-modifier-logic"
]

# Allow file writing for scripts (e.g. VerifierDeployer writes VerifiersConst.sol); allow reading test-proofs for verifier tests.
# Scripts need read-write on project root for vm.writeFile to succeed.
fs_permissions = [
    { access = "read-write", path = "src" },
    { access = "read-write", path = "script" },
    { access = "read-write", path = "test" },
    { access = "write", path = "src/VerifiersConst.sol" },
    { access = "read", path = "test/test-proofs" }
]